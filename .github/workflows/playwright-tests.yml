name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      TEST_ENV: test
      ENVIRONMENT: test
      UI_BASE_URL: https://www.service.nsw.gov.au
      UI_SEARCH_PATH: /search-results
      FUEL_API_BASE_URL: https://api.onegov.nsw.gov.au
      FUEL_API_OAUTH_PATH: /oauth/client_credential/accesstoken?grant_type=client_credentials
      FUEL_API_LOVS_PATH: /FuelCheckRefData/v1/fuel/lovs
      FUEL_API_KEY: ${{ secrets.FUEL_API_KEY }}
      FUEL_API_SECRET: ${{ secrets.FUEL_API_SECRET }}
      FUEL_API_AUTH_HEADER: ${{ secrets.FUEL_API_AUTH_HEADER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - name: Publish CTRF test report
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/*.json'
          github-report: true
          test-report: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
